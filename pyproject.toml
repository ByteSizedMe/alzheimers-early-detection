[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimers-detection"
version = "0.1.0"
description = "Early detection of Alzheimer's disease from MRI slices and clinical records"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.2",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
alz-prepare = "alzheimers.data.prepare:main"
alz-train = "alzheimers.training.train:main"
alz-evaluate = "alzheimers.training.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
